  [9,  'R', 215, 840, 226, '+ Add time slot', 'Adds a new row to the Shot List sheet'],

];
const IMG_X = 320, IMG_Y = 40, NS = 'http://www.w3.org/2000/svg';
const g = document.getElementById('labels');
const el = (tag, attrs, text) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text) e.textContent = text;
  g.appendChild(e);
  return e;
};
PARTS.forEach(([n, side, ly, tx, ty, title, desc]) => {
  const left = side === 'L';
  const bx = left ? 296 : 1392;           // badge centre
  const sx = left ? 312 : 1376;           // arrow start, just past the badge
  const X = IMG_X + tx, Y = IMG_Y + ty;
  el('path', { class: 'arrow', d: `M${sx},${ly} L${X},${Y}`, 'marker-end': 'url(#head)' });
  el('circle', { class: 'dot', cx: X, cy: Y, r: 3.5 });
  el('circle', { class: 'badge', cx: bx, cy: ly, r: 13 });
  el('text', { class: 'n', x: bx, y: ly + 4.5, 'text-anchor': 'middle' }, n);
  const ax = left ? bx - 20 : bx + 20, anchor = left ? 'end' : 'start';
  el('text', { class: 't', x: ax, y: ly - 2, 'text-anchor': anchor }, title);
  el('text', { class: 'd', x: ax, y: ly + 15, 'text-anchor': anchor }, desc);
});
