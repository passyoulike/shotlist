<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radi Production Shot List Web App</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6eb;
    --brand:#0f5c4d; --brand-soft:#e3f1ed; --accent:#d97706;
    --pending:#9ca3af; --shooting:#2563eb; --done:#16a34a; --skip:#b91c1c;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header.top{background:var(--brand);color:#fff;padding:16px 16px 0}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;max-width:1200px;margin:0 auto}
  h1{margin:0;font-size:18px;font-weight:650}
  .sub{opacity:.8;font-size:12px;margin-top:2px}
  #saveState{font-size:12px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:99px;white-space:nowrap}
  nav.tabs{display:flex;gap:4px;max-width:1200px;margin:14px auto 0}
  nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:#fff;opacity:.75;padding:10px 16px;font:inherit;font-weight:600;border-radius:10px 10px 0 0;cursor:pointer}
  nav.tabs button.active{background:var(--bg);color:var(--brand);opacity:1}
  nav.tabs .count{font-size:11px;background:rgba(0,0,0,.12);border-radius:99px;padding:1px 7px;margin-left:6px}
  main{max-width:1200px;margin:0 auto;padding:16px}
  .panel{display:none}.panel.active{display:block}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .toolbar input[type=search]{flex:1 1 200px;min-width:0}
  input,textarea,select{font:inherit;color:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;width:100%}
  textarea{resize:vertical;min-height:36px}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
  [readonly]{background:#f8f9fa;color:var(--muted)}
  .btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:6px;border-radius:6px}
  button.del:hover{background:#fee2e2;color:var(--skip)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .summary{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:16px;align-items:end;margin-bottom:12px}
  label.lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
  .prog .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .prog .bar span{display:block;height:100%;background:var(--done);transition:width .3s}
  .prog .txt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}

  /* Shot list slots */
  .slots{display:grid;gap:10px}
  .slot{display:grid;grid-template-columns:170px 1fr 150px;gap:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pending);border-radius:var(--radius);padding:12px}
  .slot.st-shooting{border-left-color:var(--shooting)}
  .slot.st-done{border-left-color:var(--done);background:#f6fbf7}
  .slot.st-skipped{border-left-color:var(--skip);opacity:.75}
  .slot .time input{font-weight:700;font-size:15px}
  .slot .body{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .slot .body .full{grid-column:1/-1}
  .slot .side{display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .slot .side .del{align-self:flex-end}
  .merged-note{font-size:11px;color:var(--muted);margin-top:2px}

  /* Tables */
  .table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
  table{border-collapse:collapse;width:100%;min-width:900px}
  th,td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fafbfc;position:sticky;top:0;white-space:nowrap;padding:10px 6px}
  td input,td select,td textarea{border-color:transparent;background:transparent}
  td input:hover,td textarea:hover,td select:hover{border-color:var(--line)}
  td.num{width:70px}
  td.ro{color:var(--muted);text-align:center;padding-top:13px}
  tr.st-done td{background:#f6fbf7}
  tr.st-reshoot td{background:#fff7ed}

  select.status{font-weight:600}
  select.status.v-done{color:var(--done)} select.status.v-shooting,select.status.v-in-progress{color:var(--shooting)}
  select.status.v-skipped,select.status.v-reshoot{color:var(--skip)}

  /* Category chips + photo board */
  .catbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:12px}
  .catbar .lbl{margin:0}
  .catbar select{flex:0 1 320px;width:auto;min-width:200px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
  .chip span{font-size:11px;color:var(--muted);margin-left:4px}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .chip.on span{color:rgba(255,255,255,.8)}
  .board-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .board-head{align-items:center;flex-wrap:wrap}
  .board-head h2{margin:0;font-size:17px}
  .board-head span{color:var(--muted);font-size:12px;margin-left:auto}
  .ph-gap{aspect-ratio:4/3}
  .board-head .donecount{color:var(--done)}
  .vdone{position:absolute;left:6px;bottom:6px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);color:var(--ink);font-size:11px;font-weight:600;padding:3px 8px 3px 5px;border-radius:99px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .vdone input{width:15px;height:15px;margin:0;accent-color:var(--done);cursor:pointer}
  .ph.is-done{outline:4px solid var(--done);outline-offset:-4px}
  .ph.is-done .vdone{background:var(--done);color:#fff}
  .nophotos{color:var(--muted);font-size:12px;padding:4px 12px 2px}
  .slotboard{margin-top:18px}
  .slotboard:first-of-type{margin-top:0}
  .slothead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 16px;padding:10px 12px;background:var(--brand-soft);border-radius:10px;margin-bottom:8px}
  .slotleft{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
  .slottime{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .slottime b{font-size:15px;color:var(--brand)}.slottime span{font-size:13px;color:var(--muted)}
  .chip.slotcat{padding:3px 10px;font-size:11px;background:var(--brand);border-color:var(--brand);color:#fff}
  .facline{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:4px 8px;font-size:13px;text-align:right;max-width:55%}
  .faclabel{font-weight:700;color:var(--ink)}
  .facval{color:var(--ink);word-break:break-word}
  .facval em{color:var(--muted)}
  .facedit{margin-left:auto;display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px}
  .facedit .lbl{margin:0}
  .facbtns{display:flex;gap:6px;justify-content:flex-end}
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
  .tile{display:flex;flex-direction:column;gap:4px;min-width:0}
  .tlabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tlabel small{font-weight:600;color:var(--brand)}
  .colh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:center;align-self:end}
  .ph{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#f1f3f5;border:2px dashed #d4d8de;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px;text-align:center;padding:6px}
  .ph.has{border:0;padding:0;background:#000}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .plus{font-size:22px;line-height:1}
  .ph .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px}
  .ph .armed-ui{display:none}
  .ph.armed{border-color:var(--brand);border-style:solid;background:var(--brand-soft);color:var(--brand)}
  .ph.armed .idle-ui{display:none}.ph.armed .armed-ui{display:flex;flex-direction:column;gap:6px;align-items:center}
  .ph.busy::after{content:'Uploading…';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.85);color:var(--brand);font-weight:600}
  #lb{position:fixed;inset:0;background:rgba(10,14,20,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  #lb .lb-box{max-width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
  #lb img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;border-radius:8px;background:#000}
  #lb .lb-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#fff}
  #lb .lb-bar span{flex:1;min-width:160px;font-weight:600}

  /* Audio */
  .song{margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
  .song-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .song-head h2{margin:0;font-size:17px;word-break:break-word}
  .song-frame{width:100%;height:150px;border:0;border-radius:10px;background:#f1f3f5}
  .song-frame.video{height:auto;aspect-ratio:16/9}
  .upload-card{margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
  .upload-card h3,.list-title{margin:0;font-size:15px}
  .list-title{margin:4px 0 10px}
  .upload-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .upload-row > div{flex:1 1 220px}
  .upload-row input[type=file]{flex:1 1 260px;width:auto}
  .hint{color:var(--muted)}
  .media{display:grid;gap:8px}
  .media-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
  .media-item.playing{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
  .media-icon{font-size:22px}
  .media-info{flex:1;min-width:0;display:flex;flex-direction:column}
  .media-info b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .media-info span{font-size:12px;color:var(--muted)}
  .media-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

  /* Notes */
  .btn.danger{color:var(--skip);border-color:#f3c4c4}
  .btn.small{padding:4px 10px;font-size:12px}
  .unlock{display:flex;gap:6px}
  .unlock input{width:170px}
  .note-editor{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
  .note-editor h3{margin:0 0 4px;font-size:16px}
  .note-editor .lbl{margin-top:4px}
  .note-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
  .note-row > div{flex:1 1 220px}
  .pin{display:flex;align-items:center;gap:6px;font-weight:600;padding-bottom:8px;cursor:pointer}
  .pin input{width:auto}
  .note-actions{display:flex;gap:8px;margin-top:8px}
  .notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-items:start}
  .note{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .note.pinned{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .note-head{display:flex;justify-content:space-between;gap:8px;width:100%}
  .note-head h3{margin:0;font-size:15px;word-break:break-word}
  .note-body{white-space:normal;word-break:break-word;line-height:1.5}
  .note-body a{color:var(--brand)}
  .note-foot{font-size:11px;color:var(--muted)}

  .meet{max-width:520px;margin:24px auto;text-align:center;padding:32px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .meet h2{margin:0;font-size:20px}
  .meet p{margin:0;color:var(--muted)}
  .meet-icon{width:56px;height:56px;padding:12px;border-radius:16px;background:var(--brand-soft);fill:var(--brand)}
  a.btn{display:inline-block;text-decoration:none}
  .meet-join{font-size:16px;padding:12px 28px;margin-top:6px}
  .meet-link{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:8px}
  .meet-link code{user-select:all;background:#f1f3f5;padding:7px 10px;border-radius:8px;font-size:13px;word-break:break-all}

  .empty{text-align:center;padding:40px 16px;color:var(--muted)}
  .hidden{display:none!important}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
  #toast.show{opacity:1}
  #toast.err{background:var(--skip)}

  @media (max-width:760px){
    .facline{max-width:100%}
    .summary{grid-template-columns:1fr}
    .slot{grid-template-columns:1fr}
    .slot .body{grid-template-columns:1fr}
    .slot .side{flex-direction:row;align-items:center}
    nav.tabs button{padding:10px 12px}
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .tlabel{font-size:9px}
    .ph{font-size:10px}
    .ph .tag{display:none}
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div><h1 id="title">Radi Production Shot List Web App</h1><div class="sub" id="sub">Loading…</div></div>
    <div id="saveState">Loading…</div>
  </div>
  <nav class="tabs">
    <button data-tab="shot" class="active">Shot List<span class="count" id="c-shot"></span></button>
    <button data-tab="notes">Notes<span class="count" id="c-notes"></span></button>
    <button data-tab="audio">Audio<span class="count" id="c-audio"></span></button>
    <button data-tab="meet">Meeting</button>
  </nav>
</header>

<main>
  <section id="tab-shot" class="panel active"></section>
  <section id="tab-notes" class="panel"></section>
  <section id="tab-audio" class="panel"></section>
  <section id="tab-meet" class="panel">
    <!-- Google Meet refuses to load inside other pages, so this tab opens the call in a new tab. -->
    <div class="card meet">
      <svg class="meet-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="13" height="12" rx="2.5"/><path d="M16 10.5 21.2 7.4a.5.5 0 0 1 .8.4v8.4a.5.5 0 0 1-.8.4L16 13.5z"/></svg>
      <h2>Team meeting</h2>
      <p>Google Meet opens in a new tab.</p>
      <a class="btn primary meet-join" href="https://meet.google.com/opu-mwsg-cnm" target="_blank" rel="noopener">Join Google Meet</a>
      <div class="meet-link">
        <code id="meet-url">https://meet.google.com/opu-mwsg-cnm</code>
        <button class="btn" data-copymeet>Copy link</button>
      </div>
    </div>
  </section>
</main>

<datalist id="dl-times"></datalist>
<datalist id="dl-locs"></datalist>
<datalist id="dl-team"></datalist>
<datalist id="dl-types"></datalist>
<div id="toast"></div>
<div id="lb" class="hidden">
  <div class="lb-box">
    <img id="lb-img" alt="">
    <div class="lb-bar">
      <span id="lb-cap"></span>
      <button class="btn" data-lb="replace">Replace</button>
      <button class="btn" data-lb="remove">Remove</button>
      <button class="btn primary" data-lb="close">Close</button>
    </div>
  </div>
</div>

<script>
// Google's page compressor treats a double slash or slash-star inside strings as a comment and cuts
// the code, so links are built from this constant and no string may contain those sequences.
const HTTPS = 'https:' + '/' + '/';
const STATUS = { shot: ['Pending', 'Shooting', 'Done', 'Skipped'], sl1: ['Pending', 'In Progress', 'Done', 'Reshoot'] };
const SHOT_TYPES = ['Wide', 'Medium', 'Close-up', 'Extreme close-up', 'B-roll', 'Interview', 'Detail', 'Group', 'Drone'];
let DATA = null, pending = 0;

/* ---------- server bridge (falls back to sample data when opened outside Apps Script) ---------- */
function api(fn, ...args) {
  if (typeof google === 'undefined' || !google.script) return MOCK[fn](...args);
  return new Promise((res, rej) =>
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}

async function load(quiet) {
  if (!quiet) setState('Loading…');
  try {
    DATA = await api('getData');
    renderAll();
    setState('Synced ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
  } catch (e) { fail(e); }
}

async function save(fn, args) {
  pending++; setState('Saving…');
  try { const r = await api(fn, ...args); setState('Saved ✓'); return r; }
  catch (e) { fail(e); throw e; }
  finally { pending--; }
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slug = v => String(v || '').toLowerCase().replace(/\s+/g, '-');
const col = (d, name) => d.headers.findIndex(h => String(h).trim().toLowerCase() === name);
const colStarts = (d, name) => d.headers.findIndex(h => String(h).trim().toLowerCase().startsWith(name));
const uniq = a => [...new Set(a.map(s => String(s).trim()).filter(Boolean))];
function setState(t) { $('#saveState').textContent = t; }
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 3000);
}
function fail(e) { setState('Error'); toast((e && e.message) || String(e), true); }
function rowText(r) { return r.cells.join(' ').toLowerCase(); }
function statusSelect(key, r, ci) {
  const v = r.cells[ci] || '';
  const opts = ['', ...uniq([...STATUS[key], v])]
    .map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${o ? esc(o) : '—'}</option>`).join('');
  return `<select class="status v-${slug(v)}" data-k="${key}" data-r="${r.row}" data-c="${ci + 1}">${opts}</select>`;
}
function lines(v) { return Math.min(8, Math.max(1, String(v || '').split(/\n/).length)); }

/* ---------- rendering ---------- */
function renderAll() {
  const s = DATA.shot;
  renderSub();
  $('#c-shot').textContent = DATA.shot.rows.length;
  refreshNoteCount();
  renderLists();
  renderShot(); renderNotes(); renderAudio();
}

// Header line under the app name: the shoot title from cell A1 and the shoot date.
function renderSub() {
  const s = DATA.shot;
  $('#sub').textContent = [s.title, s.date ? 'Shoot date: ' + s.date : 'Shoot date not set'].filter(Boolean).join(' · ');
}

function renderLists() {
  const s = DATA.shot, t = DATA.team;
  const opt = a => a.map(v => `<option value="${esc(v)}">`).join('');
  $('#dl-times').innerHTML = opt(uniq(s.rows.map(r => r.cells[0])));
  $('#dl-locs').innerHTML = opt(uniq(s.rows.map(r => r.cells[1])));
  $('#dl-team').innerHTML = opt(uniq(t.rows.map(r => r.cells[0])));
  $('#dl-types').innerHTML = opt(SHOT_TYPES);
}

function toolbar(key, addLabel) {
  return `<div class="toolbar">
    <input type="search" placeholder="Search…" data-search="${key}">
    <button class="btn primary" data-add="${key}">+ ${addLabel}</button>
    <button class="btn" data-refresh>↻ Refresh</button>
  </div>`;
}

function progress(done, total, label) {
  const pct = total ? Math.round(done / total * 100) : 0;
  return `<div class="prog"><div class="bar"><span style="width:${pct}%"></span></div>
    <div class="txt"><span>${done} of ${total} ${label}</span><span>${pct}%</span></div></div>`;
}

/* ---------- categories & photos (Shot List columns: CATEGORY, then one photo column per shot type) ---------- */
const EDIT = '__edit__';
let CAT = '';
try { CAT = localStorage.getItem('cat') || ''; } catch (_) {}

// A category applies to its own row and every row below it until the next category is set.
function shotCats(d) {
  const ci = col(d, 'category');
  let cur = '';
  return d.rows.map(r => { const v = ci < 0 ? '' : String(r.cells[ci] || '').trim(); if (v) cur = v; return cur; });
}
function photoCols(d) {
  const ci = col(d, 'category');
  return ci < 0 ? [] : d.headers.map((h, i) => i).filter(i => i > ci && String(d.headers[i]).trim());
}
function toImg(text) {
  const t = String(text || '').trim();
  const m = /drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/.exec(t);
  if (m) return HTTPS + 'drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600';
  return /^https?:[\/][\/]/i.test(t) ? t : '';
}
const TAKES = 5; // photo rows under each time slot (row 1 = the Shot List cell, rows 2-5 = PHOTOS sheet)
let SHOW_EMPTY = false; // empty photo boxes are hidden until "+ Add photos" is pressed

/* ---------- Faculty / CI under each time slot (editable in place, saved to the Shot List sheet) ---------- */
let FAC_EDIT = null; // Shot List row whose Faculty / CI is being edited
function facCol(d) {
  const i = d.headers.findIndex(h => String(h).trim().toLowerCase().startsWith('faculty'));
  return i >= 0 ? i : 2;
}

function facultyHtml(d, r) {
  const fi = facCol(d), label = esc(d.headers[fi] || 'Faculty / CI'), v = String(r.cells[fi] || '').trim();
  if (FAC_EDIT === r.row) {
    return `<div class="facedit">
      <label class="lbl" for="fac-input">${label}</label>
      <textarea id="fac-input" rows="${Math.max(2, lines(v))}" placeholder="Name(s), one per line">${esc(v)}</textarea>
      ${r.locked[fi] ? '<small class="hint">Shared with the slot(s) above, so they update too.</small>' : ''}
      <div class="facbtns"><button class="btn small" data-fac="cancel">Cancel</button>
        <button class="btn small primary" data-fac="save" data-r="${r.row}">Save</button></div>
    </div>`;
  }
  return `<div class="facline">
    <span class="faclabel">${label}:</span>
    <span class="facval">${v ? esc(v.split(/\n+/).map(s => s.trim()).filter(Boolean).join(', ')) : '<em>Not set</em>'}</span>
    <button class="btn small" data-fac="edit" data-r="${r.row}" title="Edit ${label}">✎ Edit</button>
  </div>`;
}

// A merged Faculty / CI cell covers several slots: update the whole group locally.
function setFaculty(row, fi, value) {
  const rows = DATA.shot.rows;
  let i = rows.findIndex(x => x.row === row);
  if (i < 0) return;
  while (i > 0 && rows[i].locked[fi]) i--;
  do { rows[i].cells[fi] = value; i++; } while (i < rows.length && rows[i].locked[fi]);
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-fac]');
  if (!b) return;
  const act = b.dataset.fac;
  if (act === 'edit') {
    FAC_EDIT = +b.dataset.r; renderShot();
    const ta = $('#fac-input'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    return;
  }
  if (act === 'cancel') { FAC_EDIT = null; return renderShot(); }
  if (act === 'save') {
    const row = +b.dataset.r, fi = facCol(DATA.shot), value = $('#fac-input').value.trim();
    b.disabled = true; b.textContent = 'Saving…';
    try {
      await save('updateCell', ['shot', row, fi + 1, value]);
      setFaculty(row, fi, value);
      FAC_EDIT = null; renderShot(); toast('Faculty / CI updated');
    } catch (_) { b.disabled = false; b.textContent = 'Save'; }
  }
});

function photo(r, ci, take) {
  if (!take || take === 1) return (r.img && r.img[ci]) || toImg(r.cells[ci]);
  const x = (DATA.shot.extra || []).find(p => p.slot === r.row && p.col === ci + 1 && p.take === take);
  return x ? x.url : '';
}

function isDone(r, ci, take) {
  return (DATA.shot.extra || []).some(p => p.slot === r.row && p.col === ci + 1 && p.take === take && p.done);
}

function phCell(d, r, ci, take) {
  const u = photo(r, ci, take), a = `data-ph data-r="${r.row}" data-c="${ci + 1}" data-t="${take}" tabindex="0"`;
  const done = u && isDone(r, ci, take);
  return u
    ? `<div class="ph has ${done ? 'is-done' : ''}" ${a}><img src="${esc(u)}" loading="lazy" alt="${esc(d.headers[ci])}">
        <label class="vdone" title="Tick when this video is done"><input type="checkbox" data-done ${done ? 'checked' : ''}>Video done</label></div>`
    : `<div class="ph" ${a}>
        <div class="idle-ui"><div class="plus">+</div>Add photo</div>
        <div class="armed-ui"><button class="btn primary" data-upload>Upload</button><small>or paste (Ctrl+V)</small></div>
      </div>`;
}

// rows: the time slots to show; catOf: the category of each of those rows (shown as a chip under the time)
function renderBoard(d, rows, pcols, catOf) {
  let filled = 0, doneCount = 0;
  rows.forEach(r => pcols.forEach(ci => {
    for (let t = 1; t <= TAKES; t++) if (photo(r, ci, t)) { filled++; if (isDone(r, ci, t)) doneCount++; }
  }));
  const slots = rows.map((r, i) => {
    // Only shot types that have a picture are shown, 5 per row, wrapping below.
    // While adding photos, each shot type also gets one empty box (its next free photo number).
    const tiles = [];
    pcols.forEach(ci => {
      let next = 0;
      for (let t = 1; t <= TAKES; t++) {
        if (photo(r, ci, t)) tiles.push([ci, t]);
        else if (!next) next = t;
      }
      if (SHOW_EMPTY && next) tiles.push([ci, next]);
    });
    const label = (ci, t) => esc(d.headers[ci]) + (t > 1 ? ` <small>#${t}</small>` : '');
    const cat = catOf[i];
    return `<section class="slotboard" data-text="${esc(rowText(r) + ' ' + cat.toLowerCase())}">
      <div class="slothead">
        <div class="slotleft">
          <div class="slottime"><b>${esc(r.cells[0])}</b><span>${esc(r.cells[1])}</span></div>
          ${cat ? `<button class="chip slotcat" data-cat="${esc(cat)}" title="Show only ${esc(cat)}">${esc(cat)}</button>` : ''}
        </div>
        ${facultyHtml(d, r)}
      </div>
      ${tiles.length ? `<div class="grid">
        ${tiles.map(([ci, t]) => `<div class="tile"><div class="tlabel">${label(ci, t)}</div>${phCell(d, r, ci, t)}</div>`).join('')}
      </div>` : '<div class="nophotos">No photos yet</div>'}
    </section>`;
  }).join('');
  return `<div class="card">
    <div class="board-head"><h2>${esc(CAT || 'All time slots')}</h2>
      <span><b class="donecount">${doneCount} of ${filled} videos done</b> · ${filled} photos · ${rows.length} time slot${rows.length === 1 ? '' : 's'}</span>
      <button class="btn ${SHOW_EMPTY ? 'primary' : ''}" data-showempty>${SHOW_EMPTY ? 'Done adding' : '+ Add photos'}</button>
    </div>
    ${pcols.length ? slots : '<div class="empty">Add shot-type headings to the right of CATEGORY in the sheet (e.g. CLOSE UP, MEDIUM).</div>'}
  </div>`;
}

// Category field on an edit card: existing categories, plus a blank (inherits the slot above) and "+ New category…".
function catSelect(r, ci, names) {
  const v = String(r.cells[ci] || '').trim();
  const opts = ['', ...uniq([...names, v])].map(o =>
    `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${o ? esc(o) : '— same as slot above —'}</option>`).join('');
  return `<select data-k="shot" data-r="${r.row}" data-c="${ci + 1}" data-catfield ${r.locked[ci] ? 'disabled' : ''}>
    ${opts}<option value="${NEW_CAT}">+ New category…</option></select>`;
}
const NEW_CAT = '__new__';

function renderShot() {
  const d = DATA.shot, si = col(d, 'status'), ni = col(d, 'notes'), ci = col(d, 'category');
  const done = d.rows.filter(r => r.cells[si] === 'Done').length;
  const cats = shotCats(d), names = uniq(cats), pcols = photoCols(d);
  // CAT: '' = every time slot's photos on one page, a category name = only that category, EDIT = the editable slot list.
  if (CAT && CAT !== EDIT && !names.includes(CAT)) CAT = '';
  const chips = `<div class="catbar">
      <label class="lbl" for="catselect">Category</label>
      <select id="catselect" data-catselect>
        <option value="" ${CAT && CAT !== EDIT ? '' : 'selected'}>All categories (${d.rows.length})</option>
        ${names.map(n => `<option value="${esc(n)}" ${n === CAT ? 'selected' : ''}>${esc(n)} (${cats.filter(c => c === n).length})</option>`).join('')}
      </select>
      <button class="btn ${CAT === EDIT ? 'primary' : ''}" data-cat="${CAT === EDIT ? '' : EDIT}">${CAT === EDIT ? '← Back to photos' : '✎ Edit slots'}</button>
    </div>`;
  const shown = d.rows.map((r, i) => i).filter(i => !CAT || cats[i] === CAT);
  const slots = d.rows.map(r => {
    const st = r.cells[si] || '', lockedFac = r.locked[2];
    const f = (ci, tag) => tag === 'ta'
      ? `<textarea data-k="shot" data-r="${r.row}" data-c="${ci + 1}" rows="${lines(r.cells[ci])}" ${r.locked[ci] ? 'readonly' : ''}>${esc(r.cells[ci])}</textarea>`
      : `<input data-k="shot" data-r="${r.row}" data-c="${ci + 1}" value="${esc(r.cells[ci])}" ${r.locked[ci] ? 'readonly' : ''}>`;
    return `<article class="slot st-${slug(st)}" data-row="${r.row}" data-text="${esc(rowText(r))}">
      <div class="time"><label class="lbl">Time</label>${f(0)}</div>
      <div class="body">
        <div><label class="lbl">Location</label>${f(1)}</div>
        <div><label class="lbl">Faculty / CI</label>${f(2, 'ta')}${lockedFac ? '<div class="merged-note">Shared with the slot above (merged cell)</div>' : ''}</div>
        ${ci >= 0 ? `<div><label class="lbl">Category</label>${catSelect(r, ci, names)}</div>` : ''}
        <div class="${ci >= 0 ? '' : 'full'}"><label class="lbl">Notes</label>${f(ni)}</div>
      </div>
      <div class="side"><div style="flex:1"><label class="lbl">Status</label>${statusSelect('shot', r, si)}</div>
        <button class="del" title="Delete slot" data-del="shot" data-r="${r.row}">✕</button></div>
    </article>`;
  }).join('');

  $('#tab-shot').innerHTML = `
    <div class="summary card">
      <div><label class="lbl">Shoot date</label><input data-date value="${esc(d.date)}" placeholder="e.g. Oct 10, 2026"></div>
      <div data-prog="shot">${progress(done, d.rows.length, 'slots done')}</div>
    </div>
    ${chips}
    ${toolbar('shot', 'Add time slot')}
    ${CAT === EDIT || !pcols.length
      ? `<div class="slots">${slots || '<div class="empty card">No time slots yet.</div>'}</div>`
      : renderBoard(d, shown.map(i => d.rows[i]), pcols, shown.map(i => cats[i]))}`;
}

function renderTable(key, extraHead, extraCell) {
  const d = DATA[key];
  const body = d.rows.map(r => {
    const st = col(d, 'status') >= 0 ? r.cells[col(d, 'status')] : '';
    const cells = d.headers.map((h, ci) => `<td class="${ci === 0 && key === 'sl1' ? 'num' : ''}">${field(key, d, r, ci)}</td>`).join('');
    return `<tr class="st-${slug(st)}" data-row="${r.row}" data-text="${esc(rowText(r))}">${cells}${extraCell ? extraCell(r) : ''}
      <td><button class="del" title="Delete row" data-del="${key}" data-r="${r.row}">✕</button></td></tr>`;
  }).join('');
  return `<div class="table-wrap"><table>
    <thead><tr>${d.headers.map(h => `<th>${esc(h)}</th>`).join('')}${extraHead || ''}<th></th></tr></thead>
    <tbody>${body || `<tr><td colspan="${d.headers.length + 2}" class="empty">No rows yet. Click “+ Add”.</td></tr>`}</tbody>
  </table></div>`;
}

function field(key, d, r, ci) {
  const h = String(d.headers[ci]).trim().toLowerCase(), v = r.cells[ci];
  const a = `data-k="${key}" data-r="${r.row}" data-c="${ci + 1}" ${r.locked[ci] ? 'readonly' : ''}`;
  if (h === 'status' && STATUS[key]) return statusSelect(key, r, ci);
  if (h.includes('description') || h === 'notes') return `<textarea ${a} rows="${lines(v)}">${esc(v)}</textarea>`;
  let list = '';
  if (key === 'sl1') {
    if (h === 'time') list = 'dl-times';
    else if (h === 'location') list = 'dl-locs';
    else if (h.startsWith('assigned')) list = 'dl-team';
    else if (h === 'shot type') list = 'dl-types';
  } else if (key === 'team' && h === 'assignment') list = 'dl-locs';
  return `<input ${a} value="${esc(v)}" ${list ? `list="${list}"` : ''}>`;
}

/* ---------- Notes tab: everyone can read; an admin (password checked on the server) can write ---------- */
let ADMIN = null;            // admin token from the server, kept only for this browser tab
let EDITING = null;          // the note being edited ({} for a new one)
let NOTE_Q = '', NOTE_TAG = '';
try { ADMIN = sessionStorage.getItem('admin') || null; } catch (_) {}

function linkify(text) {
  return esc(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, '<br>');
}

function renderNotes() {
  const notes = DATA.notes || [], tags = uniq(notes.map(n => n.tag));
  const editor = EDITING ? `<div class="card note-editor">
      <h3>${EDITING.id ? 'Edit note' : 'New note'}</h3>
      <label class="lbl">Title</label><input id="note-title" value="${esc(EDITING.title)}" placeholder="e.g. Call time reminder">
      <label class="lbl">Note</label><textarea id="note-body" rows="8" placeholder="Write the note… links become clickable">${esc(EDITING.body)}</textarea>
      <div class="note-row">
        <div><label class="lbl">Tag</label><input id="note-tag" list="dl-notetags" value="${esc(EDITING.tag)}" placeholder="e.g. Reminder, Client, Gear"></div>
        <label class="pin"><input type="checkbox" id="note-pinned" ${EDITING.pinned ? 'checked' : ''}> Pin to top</label>
      </div>
      <datalist id="dl-notetags">${tags.map(t => `<option value="${esc(t)}">`).join('')}</datalist>
      <div class="note-actions">
        ${EDITING.id ? '<button class="btn danger" data-note="delete">Delete</button>' : ''}
        <span style="flex:1"></span>
        <button class="btn" data-note="cancel">Cancel</button>
        <button class="btn primary" data-note="save">Save note</button>
      </div>
    </div>` : '';
  const lock = ADMIN
    ? `<button class="btn primary" data-note="new">+ New note</button><button class="btn" data-note="lock" title="Lock admin editing">🔓 Admin · Lock</button>`
    : `<form class="unlock" data-unlock><input type="password" id="admin-pw" placeholder="Admin password" autocomplete="current-password"><button class="btn">🔒 Unlock</button></form>`;
  $('#tab-notes').innerHTML = `
    <div class="toolbar">
      <input type="search" placeholder="Search notes…" data-notesearch value="${esc(NOTE_Q)}">
      ${tags.length ? `<select data-notetag style="width:auto"><option value="">All tags</option>${tags.map(t => `<option ${t === NOTE_TAG ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>` : ''}
      ${lock}
    </div>
    ${editor}
    <div id="notes-list"></div>`;
  renderNoteList();
  if ($('#media-list')) renderMediaList(); // admin Delete buttons on uploads follow the lock state
}

function renderNoteList() {
  const q = NOTE_Q.trim().toLowerCase();
  const list = (DATA.notes || [])
    .filter(n => (!NOTE_TAG || n.tag === NOTE_TAG) && (!q || [n.title, n.body, n.tag].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => (b.pinned - a.pinned) || String(b.updated).localeCompare(String(a.updated)));
  $('#notes-list').innerHTML = list.length ? `<div class="notes">${list.map(n => `
      <article class="note ${n.pinned ? 'pinned' : ''}">
        <div class="note-head">
          <h3>${n.pinned ? '📌 ' : ''}${esc(n.title || 'Untitled')}</h3>
          ${ADMIN ? `<button class="btn small" data-note="edit" data-id="${esc(n.id)}">Edit</button>` : ''}
        </div>
        ${n.tag ? `<span class="chip slotcat">${esc(n.tag)}</span>` : ''}
        <div class="note-body">${linkify(n.body)}</div>
        <div class="note-foot">Updated ${esc(n.updated)}</div>
      </article>`).join('')}</div>`
    : `<div class="empty card">${(DATA.notes || []).length ? 'No notes match.' : 'No notes yet.' + (ADMIN ? ' Click “+ New note”.' : ' Unlock as admin to add one.')}</div>`;
}

document.addEventListener('submit', async e => {
  if (!e.target.matches('[data-unlock]')) return;
  e.preventDefault();
  const pw = $('#admin-pw').value;
  if (!pw) return;
  try {
    ADMIN = await save('adminLogin', [pw]);
    try { sessionStorage.setItem('admin', ADMIN); } catch (_) {}
    renderNotes(); toast('Admin unlocked');
  } catch (_) { $('#admin-pw').value = ''; }
});

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-note]');
  if (!b) return;
  const act = b.dataset.note;
  if (act === 'new') { EDITING = { title: '', body: '', tag: NOTE_TAG, pinned: false }; return renderNotes(); }
  if (act === 'edit') { EDITING = { ...(DATA.notes.find(n => n.id === b.dataset.id) || {}) }; renderNotes(); return scrollTo({ top: 0, behavior: 'smooth' }); }
  if (act === 'cancel') { EDITING = null; return renderNotes(); }
  if (act === 'lock') {
    ADMIN = null; EDITING = null;
    try { sessionStorage.removeItem('admin'); } catch (_) {}
    toast('Admin locked'); return renderNotes();
  }
  const adminCall = async (fn, args) => {
    try { return await save(fn, args); }
    catch (err) {
      if (/expired/i.test(err && err.message)) { ADMIN = null; try { sessionStorage.removeItem('admin'); } catch (_) {} renderNotes(); }
      return null;
    }
  };
  if (act === 'save') {
    const note = { id: EDITING.id, title: $('#note-title').value, body: $('#note-body').value, tag: $('#note-tag').value, pinned: $('#note-pinned').checked };
    const res = await adminCall('saveNote', [ADMIN, note]);
    if (res) { DATA.notes = res; EDITING = null; renderNotes(); refreshNoteCount(); toast('Note saved'); }
  }
  if (act === 'delete' && confirm('Delete this note?')) {
    const res = await adminCall('deleteNote', [ADMIN, EDITING.id]);
    if (res) { DATA.notes = res; EDITING = null; renderNotes(); refreshNoteCount(); toast('Note deleted'); }
  }
});

document.addEventListener('input', e => {
  if (e.target.dataset.notesearch === undefined) return;
  NOTE_Q = e.target.value; renderNoteList();
});
document.addEventListener('change', e => {
  if (e.target.dataset.notetag === undefined) return;
  NOTE_TAG = e.target.value; renderNoteList();
});

function refreshNoteCount() { $('#c-notes').textContent = (DATA.notes || []).length; }

const MAIN_SONG_ID = '1CkKGSMxOjp23Lfbn9hchwF7S1qrRgbRZ';
const MAX_MEDIA_MB = 35;
const MEDIA_ACCEPT = '.mp3,.m4a,.wav,.aac,.ogg,.mp4,.mov,.m4v,.webm';
const drivePreview = id => HTTPS + 'drive.google.com/file/d/' + id + '/preview';

let PLAYING = null;
let UPLOADER = '';
try { UPLOADER = localStorage.getItem('uploader') || ''; } catch (_) {}

function readAsBase64(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1]);
    fr.onerror = () => rej(new Error('Could not read the file.'));
    fr.readAsDataURL(file);
  });
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-media]');
  if (!b) return;
  const act = b.dataset.media;
  if (act === 'play') {
    PLAYING = (DATA.media || []).find(m => m.id === b.dataset.id) || null;
    renderPlayer(); renderMediaList();
    return $('#media-player').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  if (act === 'close') { PLAYING = null; renderPlayer(); return renderMediaList(); }
  if (act === 'delete') {
    if (!confirm('Delete this upload? The file moves to the Drive trash.')) return;
    try {
      DATA.media = await save('deleteMedia', [ADMIN, b.dataset.id]);
      if (PLAYING && PLAYING.id === b.dataset.id) { PLAYING = null; renderPlayer(); }
      renderMediaList(); toast('Upload deleted');
    } catch (_) {}
    return;
  }
  if (act === 'upload') {
    const file = $('#media-file').files[0];
    if (!file) return toast('Choose an audio or video file first', true);
    const type = file.type || '';
    if (!type.startsWith('audio' + '/') && !type.startsWith('video' + '/')) return toast('Only audio (MP3) and video files can be uploaded', true);
    if (file.size > MAX_MEDIA_MB * 1048576) return toast('That file is over ' + MAX_MEDIA_MB + ' MB', true);
    UPLOADER = $('#media-by').value.trim();
    try { localStorage.setItem('uploader', UPLOADER); } catch (_) {}
    b.disabled = true; b.textContent = 'Uploading…';
    try {
      const base64 = await readAsBase64(file);
      DATA.media = await save('uploadMedia', [{ name: file.name, mime: type, title: $('#media-title').value.trim(), by: UPLOADER }, base64]);
      $('#media-file').value = ''; $('#media-title').value = '';
      renderMediaList(); toast('Uploaded');
    } catch (_) {}
    finally { b.disabled = false; b.textContent = 'Upload'; }
  }
});

function renderSl1() {
  const d = DATA.sl1, si = col(d, 'status');
  const done = d.rows.filter(r => r.cells[si] === 'Done').length;
  $('#tab-sl1').innerHTML = `<div class="card" style="margin-bottom:12px" data-prog="sl1">${progress(done, d.rows.length, 'shots done')}</div>` +
    toolbar('sl1', 'Add shot') + renderTable('sl1');
}

function refreshProgress(key) {
  const d = DATA[key], si = col(d, 'status'), el = document.querySelector(`[data-prog="${key}"]`);
  if (!el) return;
  el.innerHTML = progress(d.rows.filter(r => r.cells[si] === 'Done').length, d.rows.length, key === 'shot' ? 'slots done' : 'shots done');
}

/* ---------- photo upload / paste / viewer ---------- */
let PICK = null, LB = null;
// The accept filter is built from two parts because Google's page compressor treats "/" + "*" as a comment start.
const fileIn = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/' + '*' });
fileIn.addEventListener('change', () => {
  const f = fileIn.files[0]; fileIn.value = '';
  if (f && PICK) upload(PICK.r, PICK.c, PICK.t, f);
});

const phSel = (r, c, t) => `.ph[data-r="${r}"][data-c="${c}"][data-t="${t}"]`;

function arm(r, c, t) {
  PICK = { r, c, t };
  document.querySelectorAll('.ph.armed').forEach(n => n.classList.remove('armed'));
  document.querySelector(phSel(r, c, t) + ':not(.has)')?.classList.add('armed');
}

// Update the local copy after an upload/removal (take 1 = Shot List cell, 2-5 = PHOTOS sheet).
function setPhoto(r, c, t, url) {
  const same = p => p.slot === r && p.col === c && p.take === t;
  const prev = (DATA.shot.extra || []).find(same);
  const ex = DATA.shot.extra = (DATA.shot.extra || []).filter(p => !same(p));
  if (t === 1) {
    const rec = DATA.shot.rows.find(x => x.row === r);
    if (rec) { rec.img = rec.img || []; rec.img[c - 1] = url; rec.cells[c - 1] = ''; }
    if (url && prev && prev.done) ex.push(prev); // replacing keeps the tick; removing clears it
    return;
  }
  if (url) ex.push({ slot: r, col: c, take: t, url, done: !!(prev && prev.done) });
}

function setDone(r, c, t, done) {
  const ex = DATA.shot.extra = DATA.shot.extra || [];
  let p = ex.find(x => x.slot === r && x.col === c && x.take === t);
  if (!p) ex.push(p = { slot: r, col: c, take: t, url: '', done });
  p.done = done;
}

function refreshDoneCount() {
  const el = document.querySelector('.donecount');
  if (!el) return;
  const all = document.querySelectorAll('#tab-shot .ph.has').length;
  el.textContent = `${document.querySelectorAll('#tab-shot .ph.is-done').length} of ${all} videos done`;
}

function shrink(file) { // resize to max 1600px JPEG so uploads stay small
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const cv = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * s), height: Math.round(img.height * s) });
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(u);
      res(cv.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => rej(new Error('That file is not an image.'));
    img.src = u;
  });
}

async function upload(r, c, t, file) {
  const cell = document.querySelector(phSel(r, c, t));
  cell?.classList.add('busy');
  try {
    const b64 = await shrink(file);
    const name = [CAT || 'shot', DATA.shot.headers[c - 1], 'row ' + r, 'photo ' + t].join(' - ') + '.jpg';
    const url = await save('uploadPhoto', [r, c, t, name, b64, 'image/jpeg']);
    setPhoto(r, c, t, url);
    PICK = null; renderShot(); toast('Photo saved');
  } catch (e) { cell?.classList.remove('busy'); fail(e); }
}

function openLb(r, c, t) {
  const rec = DATA.shot.rows.find(x => x.row === r);
  LB = { r, c, t };
  $('#lb-img').src = photo(rec, c - 1, t);
  $('#lb-cap').textContent = [CAT, rec.cells[0], DATA.shot.headers[c - 1], 'Photo ' + t].filter(Boolean).join(' · ');
  $('#lb').classList.remove('hidden');
}
function closeLb() { $('#lb').classList.add('hidden'); $('#lb-img').src = ''; LB = null; }

document.addEventListener('paste', e => {
  if (!PICK || !$('#tab-shot').classList.contains('active')) return;
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  upload(PICK.r, PICK.c, PICK.t, item.getAsFile());
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && LB) closeLb(); });

document.addEventListener('change', e => {
  if (e.target.dataset.catselect === undefined) return;
  CAT = e.target.value; PICK = null;
  try { localStorage.setItem('cat', CAT); } catch (_) {}
  renderShot();
});

document.addEventListener('change', e => {
  if (e.target.dataset.done === undefined) return;
  const ph = e.target.closest('[data-ph]'), r = +ph.dataset.r, c = +ph.dataset.c, t = +ph.dataset.t;
  const done = e.target.checked;
  setDone(r, c, t, done);
  ph.classList.toggle('is-done', done);
  refreshDoneCount();
  save('setVideoDone', [r, c, t, done]).catch(() => {
    e.target.checked = !done; setDone(r, c, t, !done); ph.classList.toggle('is-done', !done); refreshDoneCount();
  });
});

document.addEventListener('click', async e => {
  const chip = e.target.closest('[data-cat]');
  if (chip) {
    CAT = chip.dataset.cat; PICK = null;
    try { localStorage.setItem('cat', CAT); } catch (_) {}
    return renderShot();
  }
  if (e.target.closest('[data-copymeet]')) {
    const url = $('#meet-url').textContent;
    try { await navigator.clipboard.writeText(url); toast('Meeting link copied'); }
    catch (_) { getSelection().selectAllChildren($('#meet-url')); toast('Press Ctrl+C to copy the selected link'); }
    return;
  }
  if (e.target.closest('[data-showempty]')) {
    SHOW_EMPTY = !SHOW_EMPTY; PICK = null;
    return renderShot();
  }
  const lbBtn = e.target.closest('[data-lb]');
  if (lbBtn || e.target.id === 'lb') {
    const act = lbBtn ? lbBtn.dataset.lb : 'close', cur = LB;
    closeLb();
    if (act === 'replace') { PICK = cur; fileIn.click(); }
    if (act === 'remove' && confirm('Remove this photo from the shot list?')) {
      try {
        await save('clearPhoto', [cur.r, cur.c, cur.t]);
        setPhoto(cur.r, cur.c, cur.t, '');
        renderShot(); toast('Photo removed');
      } catch (_) {}
    }
    return;
  }
  if (e.target.closest('.vdone')) return; // ticking "Video done" shouldn't open the picture
  const ph = e.target.closest('[data-ph]');
  if (ph) {
    const r = +ph.dataset.r, c = +ph.dataset.c, t = +ph.dataset.t;
    if (ph.classList.contains('has')) return openLb(r, c, t);
    arm(r, c, t);
    if (e.target.closest('[data-upload]')) fileIn.click();
  }
});

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.tab) {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b === t));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + t.dataset.tab));
    try { localStorage.setItem('tab', t.dataset.tab); } catch (_) {}
  } else if (t.dataset.refresh !== undefined) {
    load();
  } else if (t.dataset.add) {
    const k = t.dataset.add, d = DATA[k];
    let vals = [];
    if (k === 'sl1') {
      const nums = d.rows.map(r => parseInt(r.cells[0], 10)).filter(n => !isNaN(n));
      vals = d.headers.map(h => ({ 'shot #': (nums.length ? Math.max(...nums) : 0) + 1, status: 'Pending' }[String(h).toLowerCase()] ?? ''));
    } else if (k === 'shot') {
      vals = d.headers.map(h => String(h).toLowerCase() === 'status' ? 'Pending' : '');
    }
    try { DATA[k] = await save('addRow', [k, vals]); renderAll(); toast('Row added'); } catch (_) {}
  } else if (t.dataset.del) {
    const k = t.dataset.del, row = +t.dataset.r;
    if (!confirm(`Delete row ${row} from "${DATA[k].sheet}"? This removes it from the Google Sheet.`)) return;
    try { DATA[k] = await save('deleteRow', [k, row]); renderAll(); toast('Row deleted'); } catch (_) {}
  }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.date !== undefined) {
    DATA.shot.date = el.value;
    renderSub();
    return save('setDate', [el.value]).catch(() => {});
  }
  if (!el.dataset.k || el.readOnly) return;
  const k = el.dataset.k, row = +el.dataset.r, c = +el.dataset.c;
  const rec = DATA[k].rows.find(x => x.row === row);
  if (el.value === NEW_CAT) {
    const name = (prompt('New category name') || '').trim();
    if (!name) { el.value = rec ? String(rec.cells[c - 1] || '').trim() : ''; return; }
    el.add(new Option(name, name, true, true), el.options.length - 1);
  }
  if (rec) rec.cells[c - 1] = el.value;
  const wrap = el.closest('[data-row]');
  if (wrap && rec) wrap.dataset.text = rowText(rec);
  if (el.classList.contains('status')) {
    el.className = 'status v-' + slug(el.value);
    if (wrap) wrap.className = wrap.className.replace(/st-[\w-]+|st-(?=\s|$)/, 'st-' + slug(el.value));
    refreshProgress(k);
  }
  if (k === 'shot' && c <= 2 || k === 'team' && c === 1) renderLists();
  if (k === 'shot' && c === col(DATA.shot, 'category') + 1) renderShot(); // refresh category chips
  save('updateCell', [k, row, c, el.value]).catch(() => {});
});

document.addEventListener('input', e => {
  const s = e.target.dataset && e.target.dataset.search;
  if (s === undefined) return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(`#tab-${s} [data-text]`).forEach(n => n.classList.toggle('hidden', !!q && !n.dataset.text.includes(q)));
});

// Keep everyone in sync on shoot day: quiet refresh every 60s when nobody is typing.
setInterval(() => {
  const a = document.activeElement;
  if (!document.hidden && !pending && !PICK && !LB && !EDITING && FAC_EDIT === null && !(a && a.matches('input,textarea,select'))) load(true);
}, 60000);

try {
  const saved = localStorage.getItem('tab');
  if (saved) document.querySelector(`nav.tabs button[data-tab="${saved}"]`)?.click();
} catch (_) {}

/* ---------- sample data for local preview only ---------- */
const MOCK = (() => {
  const fac = 'MN-205\nMN-206\nMN-207\nMN-301\nMN-302\nMN-303\nMN-304\nMN-305';
  const db = {
    shot: { key: 'shot', sheet: 'Shot List', title: 'CAHS Promotional Shoot – Batch 2 Shot List', date: '', extra: [],
      headers: ['Time', 'Location', 'Faculty / CI', 'Status', 'Notes', 'CATEGORY', 'CLOSE UP', 'MEDIUEM', 'MEDIM', 'CLOSE UP'],
      rows: [
        ['8:00 – 8:30 AM', 'Fundamentals (Funda) Lab', 'Borja / Jay Ann'], ['8:30 – 9:00 AM', 'Anatomy Lab', 'CI:'],
        ['9:00 – 9:30 AM', 'Mock Hospital', 'CI:'], ['9:30 – 10:00 AM', 'Mock Hospital (cont.)', 'CI:'],
        ['10:00 – 10:30 AM', 'Classroom (Room: )', fac], ['10:30 – 11:00 AM', 'Classroom (Room: )', fac],
        ['11:00 – 11:30 AM', 'Classroom (Room: )', fac], ['11:30 AM – 12:00 NN', 'Buffer / Pick-up shots', '—']
      ].map((c, i) => ({ row: 5 + i, cells: [...c, '', '', i === 0 ? 'NURSING FUNDA' : '', '', '', '', ''],
        locked: [false, false, i === 5 || i === 6, false, false, false, false, false, false, false], img: Array(10).fill('') })) },
    team: { key: 'team', sheet: 'TEAM', headers: ['Name', 'Role', 'Contact No.', 'Email', 'Assignment', 'Notes'], rows: [] },
    sl1: { key: 'sl1', sheet: 'SL 1', headers: ['Shot #', 'Time', 'Location', 'Shot Description', 'Shot Type', 'Camera / Angle', 'Subject / Talent', 'Assigned To', 'Status', 'Notes'], rows: [] },
    notes: [],
    media: []
  };
  let noteId = 0;
  const stamp = () => new Date().toISOString().slice(0, 16).replace('T', ' ');
  const ok = v => Promise.resolve(v);
  return {
    getData: () => ok(JSON.parse(JSON.stringify(db))),
    // Local preview only: the real password is checked on the server.
    adminLogin: pw => pw === 'preview' ? ok('mock-token') : Promise.reject(new Error('Wrong password.')),
    saveNote: (t, n) => {
      const ex = db.notes.find(x => x.id === n.id);
      if (ex) Object.assign(ex, n, { updated: stamp() });
      else db.notes.push({ ...n, id: 'n' + (++noteId), updated: stamp(), created: stamp() });
      return ok(JSON.parse(JSON.stringify(db.notes)));
    },
    uploadMedia: (info, b64) => {
      db.media.push({ id: 'm' + (++noteId), title: info.title || info.name, name: info.name, kind: info.mime.startsWith('video') ? 'Video' : 'Audio',
        size: Math.round(b64.length * 0.75 / 104857.6) / 10, by: info.by, uploaded: stamp(), driveId: MAIN_SONG_ID });
      return ok(JSON.parse(JSON.stringify(db.media)));
    },
    deleteMedia: (t, id) => { db.media = db.media.filter(x => x.id !== id); return ok(JSON.parse(JSON.stringify(db.media))); },
    deleteNote: (t, id) => { db.notes = db.notes.filter(x => x.id !== id); return ok(JSON.parse(JSON.stringify(db.notes))); },
    updateCell: (k, r, c, v) => { const x = db[k].rows.find(y => y.row === r); if (x) x.cells[c - 1] = v; return ok(true); },
    setDate: v => { db.shot.date = v; return ok(true); },
    uploadPhoto: (r, c, t, name, b64, mime) => ok('data:' + mime + ';base64,' + b64),
    clearPhoto: () => ok(true),
    setVideoDone: () => ok(true),
    addRow: (k, vals) => {
      const d = db[k], row = d.rows.length ? Math.max(...d.rows.map(r => r.row)) + 1 : (k === 'shot' ? 5 : 2);
      d.rows.push({ row, cells: d.headers.map((_, i) => vals[i] ?? ''), locked: d.headers.map(() => false) });
      return ok(JSON.parse(JSON.stringify(d)));
    },
    deleteRow: (k, row) => {
      const d = db[k]; d.rows = d.rows.filter(r => r.row !== row).map(r => r.row > row ? { ...r, row: r.row - 1 } : r);
      return ok(JSON.parse(JSON.stringify(d)));
    }
  };
})();

load();
